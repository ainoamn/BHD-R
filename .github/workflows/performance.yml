name: Public performance budget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/i18n/**'
      - 'packages/ui/**'
      - '.github/lighthouserc.cjs'
      - '.github/lighthouse-budget.json'
      - '.github/workflows/performance.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/i18n/**'
      - 'packages/ui/**'
      - '.github/lighthouserc.cjs'
      - '.github/lighthouse-budget.json'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      API_ORIGIN: http://127.0.0.1:4000
      # Production fail-closed secrets — required for Next start during LHCI.
      BHD_R_SESSION_SECRET: ci-only-session-secret-at-least-32-bytes
      BHD_R_OIDC_STATE_SECRET: ci-only-oidc-state-secret-at-least-32b
      CSRF_SECRET: ci-only-csrf-secret-at-least-32-bytes
      FIELD_ENCRYPTION_KEY_V1: Y2ktb25seS0zMi1ieXRlLWZpZWxkLWtleS0wMQ==
      FIELD_ENCRYPTION_ACTIVE_VERSION: v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bhd-r/web... build
      - name: Run mobile Lighthouse on public routes
        run: pnpm dlx start-server-and-test@2.0.12 "pnpm --filter @bhd-r/web start" http://127.0.0.1:3000/ar "pnpm dlx @lhci/cli@0.15.1 autorun --config=.github/lighthouserc.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          if-no-files-found: ignore
          retention-days: 30
