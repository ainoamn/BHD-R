name: Scheduled pings

# Vercel Hobby only allows daily crons; this keeps the Render API warm and
# expires holds/reservations every 10 minutes. Needs repo secret CRON_SECRET
# (same value as the Vercel env var).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-pings
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SITE_ORIGIN: https://r.bhd-om.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set"
            exit 1
          fi
      - name: Warm Nest API
        run: |
          curl --fail-with-body --silent --show-error --max-time 40 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_ORIGIN/api/cron/warmup-nest"
      - name: Expire holds and reservations
        if: ${{ !cancelled() && env.CRON_SECRET != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 40 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_ORIGIN/api/cron/expire-locks"
